[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-regalloc"
version = "0.1.0"
description = "Educational three-address-code register allocation lab project"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "scikit-learn>=1.4"]
ui = ["streamlit>=1.30", "scikit-learn>=1.4"]
ml = ["scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
